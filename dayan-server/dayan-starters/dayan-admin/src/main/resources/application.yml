server:
  port: 8080
  servlet:
    context-path: /admin-api

spring:
  application:
    name: dayan-admin
  servlet:
    multipart:
      # 与前端上传提示（100MB）及百炼 DocMind 单文件上限对齐
      max-file-size: 100MB
      max-request-size: 110MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/dayan?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123}
    type: com.alibaba.druid.pool.DruidDataSource
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: 0
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  # 与 Admin 前端写死的 TOKEN_HEADER='Admin-Token' 保持一致
  # 各端独立命名（Channel-Token / Agent-Token / Client-Token 等），便于网关按端路由
  token-name: Admin-Token
  timeout: 7200
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

# 默认 StpLogic：使本进程 @SaCheckPermission 走 admin 命名空间（见 DefaultStpLogicInitializer）
dayan:
  security:
    login-type: admin
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:dayan}
    secret-key: ${MINIO_SECRET_KEY:dayan12345}
    bucket: ${MINIO_BUCKET:dayan-public}
    max-size: 10485760
    # 富文本内嵌资源公网基地址（富文本图片/视频完整 URL 生成用）。
    # 必须配置为 C 端/小程序可访问的公网地址（如 https://files.example.com），留空回退 MinIO endpoint 直链（通常仅内网可用）。
    public-base-url: ${MINIO_PUBLIC_BASE_URL:}
  # 订单服务端权威取价：strict=偏差拒单（默认）；warn=告警并按权威价入账；off=采信客户端（回滚开关）
  order:
    price-check: ${ORDER_PRICE_CHECK:strict}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
knife4j:
  enable: true
  setting:
    language: zh_cn

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.dayan: DEBUG
    org.springframework: INFO
