server:
  port: 8082
  servlet:
    context-path: /agent-api

spring:
  application:
    name: dayan-agent
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/dayan?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123}
    type: com.alibaba.druid.pool.DruidDataSource
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: 0
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  # Agent 端独立 token 头（前端 Agent-Token，命名风格与各端一致）
  token-name: Agent-Token
  timeout: 7200
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

# 默认 StpLogic：使本进程 @SaCheckPermission 走 agent 命名空间（见 DefaultStpLogicInitializer）
dayan:
  security:
    login-type: agent
  tenant:
    # agent_favorite 无 channel_code 列（按 agent_code 隔离），须跳过租户拦截器
    # poster_template / learning_content / tool_info 是全局表（后台统一定义），无 channel_code 列
    # knowledge_repo 含 channel_code 但平台库行为 NULL，agent 端靠 listForAgent 显式渠道过滤，须跳过租户拦截器
    ignore-tables: agent_favorite,poster_template,learning_content,tool_info,knowledge_repo

springdoc:
  swagger-ui:
    path: /swagger-ui.html
knife4j:
  enable: true
  setting:
    language: zh_cn

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.dayan: DEBUG
    org.springframework: INFO
