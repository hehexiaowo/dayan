server:
  port: 8082
  servlet:
    context-path: /agent-api

spring:
  config:
    import: classpath:application-common.yml
  application:
    name: dayan-agent

sa-token:
  # Agent 端独立 token 头（前端 Agent-Token，命名风格与各端一致）
  token-name: Agent-Token
  timeout: 7200
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

# 默认 StpLogic：使本进程 @SaCheckPermission 走 agent 命名空间（见 DefaultStpLogicInitializer）
dayan:
  security:
    login-type: agent
  tenant:
    # agent_favorite 无 channel_code 列（按 agent_code 隔离），须跳过租户拦截器
    # tool_info / tool_poster_template 是全局表（后台统一定义），无 channel_code 列
    # system_knowledge_repo 含 channel_code 但平台库行为 NULL，agent 端靠 listForAgent 显式渠道过滤，须跳过租户拦截器
    ignore-tables: agent_favorite,tool_info,system_knowledge_repo,tool_aichat_session,tool_aichat_message,tool_aiartist_record,tool_pensioncal_record,tool_gapcal_record,tool_poster_template
