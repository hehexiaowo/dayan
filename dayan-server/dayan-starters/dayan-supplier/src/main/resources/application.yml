server:
  port: 8084
  servlet:
    context-path: /supplier-api

spring:
  config:
    import: classpath:application-common.yml
  application:
    name: dayan-supplier

sa-token:
  # Supplier 端独立 token 头（前端 Supplier-Token，命名风格与各端一致）
  token-name: Supplier-Token
  timeout: 7200
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

# 默认 StpLogic：使本进程 @SaCheckPermission 走 supplier 命名空间（见 DefaultStpLogicInitializer）
dayan:
  security:
    login-type: supplier
