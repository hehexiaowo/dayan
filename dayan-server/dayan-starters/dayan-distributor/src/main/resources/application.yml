server:
  port: 8085
  servlet:
    context-path: /distributor-api

spring:
  config:
    import: classpath:application-common.yml
  application:
    name: dayan-distributor

sa-token:
  # Distributor 端独立 token 头（前端 Distributor-Token，命名风格与各端一致）
  token-name: Distributor-Token
  timeout: 7200
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

# 默认 StpLogic：使本进程 @SaCheckPermission 走 distributor 命名空间（见 DefaultStpLogicInitializer）
dayan:
  security:
    login-type: distributor
