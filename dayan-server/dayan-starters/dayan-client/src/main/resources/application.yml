server:
  port: 8083
  servlet:
    context-path: /client-api

spring:
  config:
    import: classpath:application-common.yml
  application:
    name: dayan-client

sa-token:
  # Client 端独立 token 头（前端 Client-Token，命名风格与各端一致）
  token-name: Client-Token
  timeout: 7200
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

# 默认 StpLogic：使本进程 @SaCheckPermission 走 client 命名空间（见 DefaultStpLogicInitializer）
dayan:
  security:
    login-type: client
