server:
  port: 8081
  servlet:
    context-path: /channel-api

spring:
  config:
    import: classpath:application-common.yml
  application:
    name: dayan-channel
  servlet:
    multipart:
      # 与前端上传提示（100MB）及百炼 DocMind 单文件上限对齐
      max-file-size: 100MB
      max-request-size: 110MB

sa-token:
  # Channel 端独立 token 头（前端 Channel-Token，命名风格与各端一致）
  token-name: Channel-Token
  timeout: 7200
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

# 默认 StpLogic：使本进程 @SaCheckPermission 走 channel 命名空间（见 DefaultStpLogicInitializer）
dayan:
  security:
    login-type: channel
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:dayan}
    secret-key: ${MINIO_SECRET_KEY:CHANGE_ME}
    bucket: ${MINIO_BUCKET:dayan-public}
    max-size: 10485760
    public-base-url: ${MINIO_PUBLIC_BASE_URL:}
