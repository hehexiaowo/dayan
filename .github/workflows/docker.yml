name: Docker Build & Push

# 仅 main 分支 push 或打 tag 时构建 Docker 镜像推送 GHCR
on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, admin, channel, agent, client, supplier, distributor, job]
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build backend jars
        working-directory: dayan-server
        run: mvn -B -ntp package -DskipTests

      - name: Determine JAR path
        id: jar
        run: |
          svc="${{ matrix.service }}"
          case "$svc" in
            gateway) jar="dayan-gateway/target/dayan-gateway.jar" ;;
            job)     jar="dayan-job/target/dayan-job.jar" ;;
            *)       jar="dayan-starters/dayan-$svc/target/dayan-$svc.jar" ;;
          esac
          echo "jar_file=$jar" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/dayan-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./dayan-server
          file: ./docker/Dockerfile
          build-args: |
            JAR_FILE=${{ steps.jar.outputs.jar_file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
