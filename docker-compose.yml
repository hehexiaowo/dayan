# 大雁养老 - 全量编排（基础设施 + 8 个应用）
#
# 用途：一键拉起完整环境（生产形态）。
# 启动：docker compose up -d --build
# 停止：docker compose down
#
# 注意：
# - MySQL 启动时自动执行 db/migration（127 表 DDL + 99_seed.sh 种子）
# - 应用依赖基础设施健康检查通过后启动
# - 前端工程需单独构建（见各自目录 README）

services:
  # ============ 基础设施 ============
  mysql:
    image: mysql:8.0
    container_name: dayan-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: dayan
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/migration:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.2-alpine
    container_name: dayan-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: dayan-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      TZ: Asia/Shanghai
    ports:
      - "${NACOS_PORT:-8848}:8848"
      - "9848:9848"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ============ 网关 ============
  dayan-gateway:
    build:
      context: ./dayan-server
      dockerfile: ../docker/Dockerfile
      args:
        JAR_FILE: dayan-gateway/target/dayan-gateway.jar
    container_name: dayan-gateway
    restart: unless-stopped
    environment:
      NACOS_ADDR: nacos:8848
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy

  # ============ 六端启动模块 ============
  dayan-admin:
    build:
      context: ./dayan-server
      dockerfile: ../docker/Dockerfile
      args:
        JAR_FILE: dayan-starters/dayan-admin/target/dayan-admin.jar
    container_name: dayan-admin
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NACOS_ADDR: nacos:8848
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy

  dayan-channel:
    build:
      context: ./dayan-server
      dockerfile: ../docker/Dockerfile
      args:
        JAR_FILE: dayan-starters/dayan-channel/target/dayan-channel.jar
    container_name: dayan-channel
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NACOS_ADDR: nacos:8848
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy

  dayan-agent:
    build:
      context: ./dayan-server
      dockerfile: ../docker/Dockerfile
      args:
        JAR_FILE: dayan-starters/dayan-agent/target/dayan-agent.jar
    container_name: dayan-agent
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NACOS_ADDR: nacos:8848
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy

  dayan-client:
    build:
      context: ./dayan-server
      dockerfile: ../docker/Dockerfile
      args:
        JAR_FILE: dayan-starters/dayan-client/target/dayan-client.jar
    container_name: dayan-client
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NACOS_ADDR: nacos:8848
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy

  dayan-supplier:
    build:
      context: ./dayan-server
      dockerfile: ../docker/Dockerfile
      args:
        JAR_FILE: dayan-starters/dayan-supplier/target/dayan-supplier.jar
    container_name: dayan-supplier
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NACOS_ADDR: nacos:8848
    ports:
      - "8084:8084"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy

  dayan-distributor:
    build:
      context: ./dayan-server
      dockerfile: ../docker/Dockerfile
      args:
        JAR_FILE: dayan-starters/dayan-distributor/target/dayan-distributor.jar
    container_name: dayan-distributor
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NACOS_ADDR: nacos:8848
    ports:
      - "8085:8085"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy

  # ============ 定时任务 ============
  dayan-job:
    build:
      context: ./dayan-server
      dockerfile: ../docker/Dockerfile
      args:
        JAR_FILE: dayan-job/target/dayan-job.jar
    container_name: dayan-job
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NACOS_ADDR: nacos:8848
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
